[package]
name = "tempera-settings"
description = "A tabbed settings dialog for a content-agnostic application shell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# `bevy_picking` because a sidebar entry is clicked, and click is a picking
# event. `bevy_ui` brings `Node`/`ComputedNode`/`ScrollPosition`, which is the
# substrate. No `bevy_ui_render` — like the dock, this crate builds a node tree
# and never draws it, so a headless test exercises every system here.
bevy = { workspace = true, features = ["bevy_ui", "bevy_picking", "bevy_log"] }
serde.workspace = true
tracing.workspace = true
# More than design tokens, unlike the dock: this crate composes tempera's
# `dialog` (the chrome, the backdrop, the Escape handling) and its
# `setting_row` / `section_header` (the form vocabulary). It draws the sidebar
# and nothing else.
tempera.workspace = true

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_ui", "bevy_picking", "bevy_log"] }
