[package]
name = "tempera-input"
description = "Keybinds and commands for a content-agnostic application shell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bevy = { workspace = true, features = ["bevy_log", "bevy_window"] }
leafwing-input-manager.workspace = true
serde.workspace = true
serde_json.workspace = true
# Keybind persistence writes to the platform config dir. The app name is a
# parameter, not a constant — tempera does not know it is running dawai.
dirs.workspace = true
tracing.workspace = true
# No `tempera` (widgets). This crate owns the keyboard vocabulary a keycap is
# drawn from — see `kbd.rs` — so the widget library depends on it, not the
# reverse. Nothing here draws anything.

[dev-dependencies]
# Tests drive a real `App`, so they need the ECS + scheduling internals that
# the lean default feature set leaves out.
bevy = { workspace = true, features = ["bevy_log", "bevy_window"] }
