[package]
name = "tempera-tree"
description = "Hierarchy, expansion and filtering for a tree view — no rendering"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# No `bevy_ui`, and that absence is the crate's thesis: this one spawns nothing.
# It reads declaration components off the host's item entities and returns a
# `Vec<VisibleRow>`. `bevy_log` is for the three malformed-hierarchy warnings,
# which are reports about the host's data rather than errors of this crate's.
bevy = { workspace = true, features = ["bevy_log"] }
serde.workspace = true
tracing.workspace = true

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_log"] }
# Persistence hands back a `Serialize` value and never picks a format; the
# round-trip test writes the same one the host does, so `ron` stays a
# dev-dependency and never appears in a public signature.
ron.workspace = true
