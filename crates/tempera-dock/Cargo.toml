[package]
name = "tempera-dock"
description = "A recursive split-tree dock for a content-agnostic application shell"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# `bevy_picking` is not optional here: dividers are dragged, and drag is a
# picking event. `bevy_ui` brings `Node`/`ComputedNode`, which is the whole
# substrate. No `bevy_ui_render` — the dock builds a node tree and never draws
# it itself, so a headless test can exercise every system in this crate.
bevy = { workspace = true, features = ["bevy_ui", "bevy_picking", "bevy_log"] }
serde.workspace = true
tracing.workspace = true
# Design tokens only. The dock paints one thing — the divider's hover tint —
# and takes the color from tempera's palette rather than asking the host for a
# theme trait to implement.
tempera.workspace = true

[dev-dependencies]
bevy = { workspace = true, features = ["bevy_ui", "bevy_picking", "bevy_log"] }
# The persistence round-trip test writes the same format the host does. This
# crate's own API is format-agnostic, so `ron` never appears in a public
# signature.
ron.workspace = true
