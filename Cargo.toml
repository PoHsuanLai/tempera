# tempera — design tokens, bevy_ui widgets, and the application shell built
# out of them.
#
# Three layers, one workspace:
#
#   crates/tempera-theme    the design tokens: a generated spacing scale, a
#                           palette, a type ramp. Knows nothing about widgets —
#                           the only thing it borrows from the UI layer is
#                           `Val`, so a token can be assigned into a `Node`.
#   crates/tempera-widgets  the widget library: buttons, dialogs, menus, rows.
#                           Knows how to draw itself and nothing about who
#                           asked. Re-exports the tokens as `tempera::theme`.
#   crates/tempera-*        the shell those widgets assemble into: keybinds and
#                           commands, docking, trees, a settings dialog.
#
# The split is what each layer is allowed to know. A shell crate knows what an
# application *shape* is — that panes divide, that commands have conditions —
# and still nothing about any particular application. It also gets to pick its
# layer: the dock needs a colour, so it depends on the tokens; settings
# composes real widgets, so it depends on those.
#
# Neither layer may name a specific app. The shell moved here from the dawai
# repo, where that was enforced by a workspace `exclude`: a shell crate could
# not depend on `dawai-*` because those packages were not members. A separate
# repository is the stronger form of the same rule.
[workspace]
resolver = "2"
members = [
    "crates/tempera-theme",
    "crates/tempera-widgets",
    "crates/tempera-dock",
    "crates/tempera-input",
    "crates/tempera-settings",
    "crates/tempera-tree",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["PoHsuan Lai"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/tempera"

# Two clippy lints fire constantly on idiomatic Bevy and say nothing useful
# about this code, so they are allowed workspace-wide.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false }
leafwing-input-manager = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6"
tracing = "0.1"
# Only the dock's persistence tests need this — `capture`/`apply` hand back a
# `Serialize` type and never pick a format. Pinned to the version dawai writes
# its sidecars with, so the round-trip test exercises the real on-disk shape
# rather than a lookalike.
ron = "0.12"

# The shell renders with the widget library beside it. This was a git
# dependency pinned to a rev until the shell moved into this repo, which meant
# a widget landing here needed a rev bump in two other files before the shell
# could use it. Consumers still pin *this* repo by rev; the point is that the
# two layers now move together.
#
# Named `tempera` here to match the library name the widget crate declares
# (`[lib] name = "tempera"`), so every use site stays `tempera::button`.
tempera = { package = "tempera-widgets", path = "crates/tempera-widgets" }

# The design tokens, separately depend-able.
#
# A crate that only needs to know what colour the surface is should not compile
# a text-input widget to find out. `tempera-dock` is the case in point: it
# reads a `ColorPalette` and nothing else, and depended on the whole widget
# library to do it.
tempera-theme = { path = "crates/tempera-theme" }

# Keybinds, commands, and the keyboard vocabulary a keycap is drawn from.
#
# `tempera-widgets` depends on this, not the other way round. `KbdChord` and the
# glyph tables are keyboard knowledge — `⌘` for Super does not depend on a
# palette — so they live with the crate that owns bindings, and the widget that
# draws a chip reads them. The reverse edge existed only so `tempera-input`
# could name one `Vec`, and it dragged the whole widget library along.
tempera-input = { path = "crates/tempera-input" }

# Bevy is unusable in pure debug. Optimize third-party deps even in dev so an
# example stays runnable; workspace crates stay unoptimized for fast
# incremental builds.
[profile.dev.package."*"]
opt-level = 3
